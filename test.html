<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ATLAS - MINIMAL TEST</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: Arial, sans-serif; padding: 20px; background: #1a1a1a; color: #e5e5e5; }
        #messages { margin-bottom: 20px; }
        .message { padding: 10px; margin: 10px 0; border-radius: 5px; }
        .user { background: #2d2438; }
        .assistant { background: #212121; }
        input { padding: 10px; width: 300px; background: #2a2a2a; border: 1px solid #3a3a3a; color: #e5e5e5; }
        button { padding: 10px 20px; background: #ab7ff5; color: white; border: none; cursor: pointer; }
        #apiCalls { color: #ff6b6b; font-weight: bold; margin-top: 20px; }
    </style>
</head>
<body>
    <h1>ATLAS - MINIMAL TEST</h1>
    <p>This version counts API calls to debug the issue.</p>
    
    <div id="messages"></div>
    
    <input type="text" id="input" placeholder="Type a message">
    <button onclick="send()">Send</button>
    
    <div id="apiCalls">API Calls: 0</div>
    
    <script>
        const WORKER_URL = 'https://atlas-proxy.hjlwarnock01.workers.dev';
        let apiCallCount = 0;
        
        // PREVENT DUPLICATE EVENT LISTENERS
        document.getElementById('input').addEventListener('keydown', function(e) {
            if (e.key === 'Enter') {
                e.preventDefault();
                send();
            }
        }, { once: false });
        
        async function send() {
            const input = document.getElementById('input');
            const message = input.value.trim();
            if (!message) return;
            
            // Reset counter
            apiCallCount = 0;
            updateCounter();
            
            input.value = '';
            addMessage('user', message);
            
            try {
                const response = await callAPI(message);
                addMessage('assistant', response);
            } catch (error) {
                addMessage('assistant', 'Error: ' + error.message);
            }
        }
        
        async function callAPI(message) {
            // INCREMENT COUNTER
            apiCallCount++;
            updateCounter();
            
            console.log(`API CALL #${apiCallCount}`);
            
            const response = await fetch(WORKER_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    contents: [
                        { role: 'user', parts: [{ text: 'You are ATLAS. Be helpful.' }] },
                        { role: 'model', parts: [{ text: 'Got it!' }] },
                        { role: 'user', parts: [{ text: message }] }
                    ],
                    generationConfig: { 
                        temperature: 0.7,
                        maxOutputTokens: 500
                    }
                })
            });
            
            if (!response.ok) {
                const error = await response.json();
                throw new Error(error.error || 'Request failed');
            }
            
            const data = await response.json();
            
            if (!data?.candidates?.[0]?.content?.parts?.[0]?.text) {
                throw new Error('Invalid response structure');
            }
            
            return data.candidates[0].content.parts[0].text;
        }
        
        function addMessage(role, content) {
            const div = document.createElement('div');
            div.className = `message ${role}`;
            div.textContent = content;
            document.getElementById('messages').appendChild(div);
        }
        
        function updateCounter() {
            document.getElementById('apiCalls').textContent = `API Calls: ${apiCallCount}`;
        }
    </script>
</body>
</html>
